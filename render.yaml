services:
  - type: web
    name: voice-agents-webhook
    runtime: node
    plan: free
    rootDir: voice-agent
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: LOGS_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
